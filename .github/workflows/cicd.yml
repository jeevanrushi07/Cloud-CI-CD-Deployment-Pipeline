name: Cloud CI/CD Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloud-cicd-greeting-app
  EC2_INSTANCE_ID: i-01222ef632ccf6f70

jobs:
  test:
    name: CI - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax check
        run: python -m py_compile app.py

      - name: Docker build test
        run: docker build -t ci-test-image .

  deploy:
    name: CD - ECR + EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "${{ steps.aws.outputs.ecr_registry }}"

      - name: Build and push commit-SHA image
        env:
          ECR_REGISTRY: ${{ steps.aws.outputs.ecr_registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"

          docker build \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            .

          docker push "$IMAGE_URI:$IMAGE_TAG"

          echo "Image pushed:"
          echo "$IMAGE_URI:$IMAGE_TAG"

           - name: Deploy to EC2 with health check and rollback
        env:
          ECR_REGISTRY: ${{ steps.aws.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_URI: ${{ steps.aws.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          DB_NAME: greetings_db
        run: |
          python - <<'PY' > /tmp/ssm-command.json
          import json
          import os

          image_uri = os.environ["IMAGE_URI"]
          aws_region = os.environ["AWS_REGION"]
          ecr_registry = os.environ["ECR_REGISTRY"]
          db_host = os.environ["DB_HOST"]
          db_user = os.environ["DB_USER"]
          db_pass = os.environ["DB_PASS"]
          db_name = os.environ["DB_NAME"]

          script = f'''#!/bin/bash
          set -e

          IMAGE_URI="{image_uri}"
          AWS_REGION="{aws_region}"
          ECR_REGISTRY="{ecr_registry}"
          DB_HOST="{db_host}"
          DB_USER="{db_user}"
          DB_PASS="{db_pass}"
          DB_NAME="{db_name}"

          echo "Logging into ECR..."

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "Pulling new image..."

          docker pull "$IMAGE_URI"

          if docker inspect cloud-cicd-app >/dev/null 2>&1; then
            echo "Saving current container for rollback..."

            docker rm -f cloud-cicd-previous >/dev/null 2>&1 || true

            docker rename cloud-cicd-app cloud-cicd-previous
          fi

          echo "Starting new container..."

          docker run -d \
            --restart unless-stopped \
            --name cloud-cicd-app \
            -p 5000:5000 \
            -e DB_HOST="$DB_HOST" \
            -e DB_NAME="$DB_NAME" \
            -e DB_USER="$DB_USER" \
            -e DB_PASS="$DB_PASS" \
            "$IMAGE_URI"

          echo "Waiting for health check..."

          HEALTHY=0

          for i in $(seq 1 18); do
            if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)" >/dev/null 2>&1; then
              HEALTHY=1
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" -eq 1 ]; then
            echo "Deployment healthy: $IMAGE_TAG"

            docker rm -f cloud-cicd-previous >/dev/null 2>&1 || true

            exit 0
          fi

          echo "New deployment failed health check."
          echo "Rolling back..."

          docker logs cloud-cicd-app || true

          docker rm -f cloud-cicd-app >/dev/null 2>&1 || true

          if docker inspect cloud-cicd-previous >/dev/null 2>&1; then
            docker rename cloud-cicd-previous cloud-cicd-app
            docker start cloud-cicd-app
            echo "Rollback completed."
          else
            echo "No previous container available for rollback."
          fi

          exit 1
          '''

          print(json.dumps({
              "commands": script.splitlines()
          }))
          PY

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-command.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          echo "----- OUTPUT -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "----- ERRORS -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          test "$STATUS" = "Success"

      - name: Public HTTP smoke test
        run: |
          APP_URL="http://13.205.166.43:5000"

          echo "Testing $APP_URL/healthz"

          for i in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "$APP_URL/healthz"; then

              echo
              echo "Public application health check passed."
              exit 0
            fi

            echo "Health check attempt $i failed. Retrying..."

            sleep 10
          done

          echo "Public health check failed."
          exit 1
